[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[project]
name = "granola-export"
version = "0.1.0"
description = "Export Granola meetings, shared notes, summaries, and transcripts to JSON and Markdown."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[project.scripts]
granola-export = "granola_export.cli:main"

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
